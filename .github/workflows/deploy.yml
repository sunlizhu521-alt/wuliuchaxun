name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup Tencent Cloud runtime data
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          port: ${{ secrets.TENCENT_PORT }}
          script: |
            set -e
            APP_DIR="/home/ubuntu/zhuge-ai-lab/wuliuchaxun"
            PROJECT_NAME="$(basename "$APP_DIR")"
            mkdir -p "$HOME/backups/$PROJECT_NAME"
            if [ -d "$APP_DIR/data" ]; then
              tar -czf "$HOME/backups/$PROJECT_NAME/data-$(date +%Y%m%d-%H%M%S).tar.gz" -C "$APP_DIR" data
              ls -lh "$HOME/backups/$PROJECT_NAME" | tail -n 5
            else
              echo "No runtime data directory to backup."
            fi

      - name: Deploy files to Tencent Cloud
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.TENCENT_HOST }}
          REMOTE_USER: ${{ secrets.TENCENT_USER }}
          REMOTE_PORT: ${{ secrets.TENCENT_PORT }}
          SOURCE: "./"
          TARGET: "/home/ubuntu/zhuge-ai-lab/wuliuchaxun/"
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: "/.git/, /.github/, /data/auth-users.json, /data/auth-users.json.tmp, /data/runtime-shared-library.json, /data/runtime-shared-library.json.tmp"

      - name: Restart static server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          port: ${{ secrets.TENCENT_PORT }}
          script: |
            set -e
            APP_DIR="/home/ubuntu/zhuge-ai-lab/wuliuchaxun"
            ls -la "$APP_DIR/dimension-library.html"
            ls -la "$APP_DIR/permission-management.html"
            grep -q "维度表文件库" "$APP_DIR/dimension-library.html"
            grep -q "权限管理" "$APP_DIR/permission-management.html"
            ln -sfn "$APP_DIR" "$APP_DIR/wuliuchaxun"
            ss -ltnp | grep ":4004" || true
            old_pids=$(ss -ltnp | sed -n 's/.*:4004.*pid=\([0-9]\+\).*/\1/p' | sort -u)
            if [ -n "$old_pids" ]; then
              echo "Stopping old static server: $old_pids"
              kill $old_pids
            fi
            sleep 1
            cd "$APP_DIR"
            APP_DIR="$APP_DIR" PORT=4004 nohup python3 "$APP_DIR/server.py" > /tmp/wuliuchaxun-serve.log 2>&1 &
            sleep 5
            ss -ltnp | grep ":4004" || true
            tail -n 40 /tmp/wuliuchaxun-serve.log || true
            curl -fsS http://127.0.0.1:4004/dimension-library.html | grep -q "维度表文件库"
            curl -fsS http://127.0.0.1:4004/permission-management.html | grep -q "权限管理"
            curl -fsS http://127.0.0.1:4004/wuliuchaxun/dimension-library.html | grep -q "维度表文件库"
            curl -fsS http://127.0.0.1:4004/wuliuchaxun/permission-management.html | grep -q "权限管理"
            curl -fsSI http://127.0.0.1:4004/dimension-library.html | grep -qi "charset=utf-8"
            curl -fsSI http://127.0.0.1:4004/permission-management.html | grep -qi "charset=utf-8"
